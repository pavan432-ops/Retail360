version: 2

models:
  - name: int_customer_status
    description: "Customer-level activity status based on purchase recency."

    columns:
      - name: customer_id
        description: "Customer identifier."
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: recency_days
        description: "Number of days since the customer's most recent purchase, measured from August 31, 2026."

      - name: customer_status
        description: "Customer activity classification based on purchase recency."
        tests:
          - accepted_values:
              values:
                - "Active"
                - "At Risk"
                - "Inactive"

      - name: total_orders
        description: "Number of distinct orders associated with the customer."

      - name: total_units
        description: "Total number of units purchased by the customer."

      - name: total_sales
        description: "Total net sales attributed to the customer."

      - name: average_order_value
        description: "Average net sales per order for the customer."

      - name: first_order_date
        description: "First recorded order date for the customer."

      - name: last_order_date
        description: "Most recent recorded order date for the customer."