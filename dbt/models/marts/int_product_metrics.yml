version: 2

models:
  - name: int_product_metrics
    description: "Product-level sales, cost, gross profit, and margin metrics."

    columns:
      - name: product_id
        description: "Unique identifier for each product."
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id

      - name: product_name
        description: "Product name."

      - name: category
        description: "Product category."

      - name: subcategory
        description: "Product subcategory."

      - name: brand
        description: "Product brand."

      - name: total_orders
        description: "Number of distinct orders containing the product."

      - name: total_units
        description: "Total units sold for the product."

      - name: total_sales
        description: "Total net sales generated by the product."

      - name: total_cost
        description: "Total estimated product cost based on units sold multiplied by cost price."

      - name: gross_profit
        description: "Net sales minus estimated product cost."

      - name: gross_margin_pct
        description: "Gross profit as a percentage of net sales."