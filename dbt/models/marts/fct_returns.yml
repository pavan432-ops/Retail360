version: 2

models:
  - name: fct_returns
    description: "Return transaction fact table at return-line grain."

    columns:
      - name: return_id
        description: "Unique identifier for each return transaction."
        tests:
          - unique
          - not_null

      - name: order_id
        description: "Identifier of the original customer order."
        tests:
          - not_null

      - name: product_id
        description: "Product identifier associated with the return."
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id

      - name: return_date
        description: "Date on which the return was recorded."

      - name: return_quantity
        description: "Number of units returned. Missing values represent invalid source quantities retained for audit."

      - name: return_reason
        description: "Reason recorded for the product return."

      - name: order_exists_in_sales
        description: "Audit flag indicating whether the referenced order exists in the sales fact."

      - name: return_quantity_exceeds_sold
        description: "Audit flag indicating whether returned quantity exceeds the recorded sold quantity."

      - name: return_before_order
        description: "Audit flag indicating whether the return date occurs before the original order date."